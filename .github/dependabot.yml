version: 2
updates:
  - package-ecosystem: 'npm'
    # Files stored in `app` directory
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: 'storybook'
      - dependency-name: '@storybook/*'
      - dependency-name: 'eslint'
